<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Editar vendedor</title></head>
<body>
    <h1>Editar {{ dados.usuario.get_full_name|default:dados.usuario.username }}</h1>

    <form method="post">
        {% csrf_token %}
        <label>Alçada de desconto (%):
            <input type="number" step="0.01" name="alcada_desconto" value="{{ dados.alcada_desconto }}">
        </label><br>
        <label>Percentual de comissão (%):
            <input type="number" step="0.01" name="percentual_comissao" value="{{ dados.percentual_comissao }}">
        </label><br>
        <button type="submit">Salvar</button>
    </form>

    <p><a href="{% url 'painel_gerente' %}">Voltar</a></p>
</body>
</html>
